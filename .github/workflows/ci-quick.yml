name: ci-quick
on:
  pull_request:
permissions: {}
jobs:
  policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Upstream base is intact apart from own files
        run: ragfit/scripts/verify-upstream-base.sh HEAD
      - name: License files present
        run: for f in LICENSE LICENSING.md NOTICE.md MODIFICATIONS.md; do test -f "$f"; done
      - name: Enterprise build tag not used
        run: |
          grep -Eq 'IsEnterprise( bool)? = false' pkg/extensions/main.go
          ! grep -rnE 'GO_BUILD_TAGS=[a-z,]*enterprise|WIRE_TAGS=[a-z,]*enterprise|-tags[= ][a-z,]*enterprise' ragfit .github
      - name: Origin wording only in license files
        # Scope: our own files only (upstream sources and docs use the phrase technically).
        # Branding patches add their files here.
        run: "! grep -rniI 'based on grafana' README.md ragfit"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Plugin config check
        run: ragfit/scripts/check-plugins.sh
      - name: Plugin policy tests (allowlist, license, type, sdk-only, signature)
        run: ragfit/scripts/test-check-plugins.sh
      - name: Plugin package path tests (fixed-string id match)
        run: ragfit/scripts/test-fetch-plugins.sh
      - name: Plugin license tests (offline)
        run: ragfit/scripts/test-plugin-licenses.sh
      - name: Plugin pins (version, checksum, license)
        run: ragfit/scripts/verify-plugin-pins.sh
      - name: Plugin bake smoke test (both architectures, stand-in base image)
        run: |
          ragfit/scripts/fetch-plugins.sh amd64 dist/plugins-amd64
          ragfit/scripts/fetch-plugins.sh arm64 dist/plugins-arm64
          printf 'FROM alpine:3.22\nRUN mkdir -p /var/lib/grafana/plugins /usr/share/grafana/data/plugins-bundled\n' | docker build -t bake-base:test -
          docker build -f ragfit/docker/Dockerfile.plugins --build-arg BASE_IMAGE=bake-base:test -t bake:test dist/plugins-amd64
          REQUIRE_PINNED=1 ragfit/scripts/check-plugins.sh bake:test
          ragfit/scripts/plugin-licenses.sh dist/plugins-amd64 dist/plugin-licenses-amd64
          ragfit/scripts/plugin-licenses.sh dist/plugins-arm64 dist/plugin-licenses-arm64
          test "$(docker run --rm bake:test stat -c '%u' /usr/share/grafana/data/plugins-bundled/yesoreyeram-infinity-datasource/plugin.json)" = 472
      - name: Deployment templates (helm lint, render, guards)
        run: ragfit/scripts/test-helm.sh
      - name: OAuth role mapping (full team claim only, deny by default)
        run: |
          python3 -m pip install --quiet jmespath==1.0.1
          python3 ragfit/scripts/test-role-mapping.py
      - name: Brand scan (report only until the branding patch lands)
        continue-on-error: true
        run: grep -rliI 'grafana' public/locales public/img | grep -v -x -f <(grep -v '^#' ragfit/brand-allowlist.txt) || true
  licenses:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # corepack first, so the yarn cache lookup in setup-node uses the repository's yarn version.
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Third-party notices and license scan
        run: ragfit/scripts/third-party-notices.sh dist/licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: licenses
          path: dist/licenses
  go-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -short ./pkg/api/... ./pkg/login/... ./pkg/services/auth/...
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # corepack first, so the yarn cache lookup in setup-node uses the repository's yarn version.
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Lint changed upstream frontend files
        run: |
          grep -v '^#' ragfit/modified-upstream-files.txt | grep -E '[.]tsx?$' | xargs -r yarn eslint --max-warnings 0
      - name: Unit tests for branding and login
        run: yarn jest --ci public/app/core/components/Branding public/app/core/components/Login
      - name: Typecheck (app)
        run: yarn tsc --noEmit
