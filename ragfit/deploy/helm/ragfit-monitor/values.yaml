# Neutral defaults only. Real values (domains, digests, secrets, dashboards) are private.
image:
  repository: ghcr.io/erynoagroup/ragfit-monitor
  # Required: deploy by digest only (sha256:...). Tags are not accepted.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Required: public base URL of this instance and of RagFit | Source.
rootUrl: ""
sourceUrl: ""

oauth:
  # Required: existing Secret with keys client_id and client_secret.
  existingSecret: ""

persistence:
  enabled: true
  existingClaim: ""
  size: 2Gi
  storageClassName: ""

# Optional provisioning, supplied by the private values.
provisioning:
  # Optional Secret with datasource credentials, mounted read-only at
  # /run/secrets/ragfit-monitor-datasources/<key>. Reference values in the datasources YAML as
  # $__file{/run/secrets/ragfit-monitor-datasources/<key>}; never put credentials into values.
  secretName: ""
  # Content of a datasources provisioning file (YAML string).
  datasources: ""
  # Map of file name to dashboard JSON (string).
  dashboards: {}

# Extra environment variables, allowlist only: GF_LOG_*, GF_ANALYTICS_*, GF_DATABASE_*, GF_METRICS_*,
# and DS_* for datasource values. Sign-in, security, server, paths, plugins and users settings are
# fixed by the chart; overriding them makes rendering fail. Names containing PASS, TOKEN, SECRET, KEY,
# CREDENTIAL or AUTH (also PASSWD, PASSWORD, APIKEY), and names ending in _URL, _URI, _DSN, _CONNSTR or
# _CONNECTION_STRING (they can carry user:password, e.g. GF_DATABASE_URL) must use
# valueFrom.secretKeyRef; a plain value makes rendering fail. The match is deliberately broad.
extraEnv: []

# Optional NetworkPolicy. When enabled, ingress to the http port is allowed only from ingressFrom
# (NetworkPolicy peers, e.g. the ingress controller's namespace). Egress stays open unless
# egress.enabled is true; then only DNS and the rules in egress.rules are allowed.
networkPolicy:
  enabled: false
  ingressFrom: []
  egress:
    enabled: false
    rules: []

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
