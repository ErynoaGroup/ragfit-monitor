apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragfit-monitor.name" . }}
  labels: {{- include "ragfit-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "ragfit-monitor.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ragfit-monitor.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ragfit-monitor
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RAGFIT_MONITOR_ROOT_URL
              value: {{ .Values.rootUrl | quote }}
            - name: RAGFIT_SOURCE_URL
              value: {{ .Values.sourceUrl | quote }}
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: dashboard-provider.yaml
            {{- if .Values.provisioning.datasources }}
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            {{- end }}
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: oauth
              mountPath: /run/secrets/ragfit-monitor-oauth
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "ragfit-monitor.name" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "ragfit-monitor.name" . }}-config
        - name: dashboards
          configMap:
            name: {{ include "ragfit-monitor.name" . }}-dashboards
        - name: oauth
          secret:
            secretName: {{ .Values.oauth.existingSecret }}
            items:
              - {key: client_id, path: client_id}
              - {key: client_secret, path: client_secret}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
