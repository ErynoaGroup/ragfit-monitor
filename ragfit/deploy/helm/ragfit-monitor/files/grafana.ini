# RagFit | Monitor: sign-in only via RagFit | Source (generic OAuth, OSS role mapping).
# No hostnames or secrets in this file. Values come from the environment at runtime:
#   RAGFIT_MONITOR_ROOT_URL   public base URL of this instance (https://monitor.<domain>/)
#   RAGFIT_SOURCE_URL         base URL of RagFit | Source (https://source.<domain>)
#   client_id / client_secret are mounted as files from a secret.
# Mount as /etc/grafana/grafana.ini (or merge via GF_* environment variables).
# See ragfit/deploy/README.md.

[server]
root_url = $__env{RAGFIT_MONITOR_ROOT_URL}

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
# Unused for OAuth users because role_attribute_strict denies a login without a role.
auto_assign_org_role = Viewer

[auth]
# No password login: form hidden and built-in login disabled. Emergency admin is CLI-only.
disable_login_form = true
disable_login = true
oauth_allow_insecure_email_lookup = false

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = RagFit | Source
icon = signin
client_id = $__file{/run/secrets/ragfit-monitor-oauth/client_id}
client_secret = $__file{/run/secrets/ragfit-monitor-oauth/client_secret}
auth_style = InHeader
scopes = openid profile email groups
auth_url = $__env{RAGFIT_SOURCE_URL}/login/oauth/authorize
token_url = $__env{RAGFIT_SOURCE_URL}/login/oauth/access_token
api_url = $__env{RAGFIT_SOURCE_URL}/login/oauth/userinfo
use_pkce = true
use_refresh_token = true
auto_login = true
allow_sign_up = true
groups_attribute_path = groups
# Only full team claims. A bare organization claim never matches.
allowed_groups = ErynoaGroup:platform-admin ErynoaGroup:monitor-editor ErynoaGroup:monitor-viewer
role_attribute_path = contains(groups[*], 'ErynoaGroup:platform-admin') && 'Admin' || contains(groups[*], 'ErynoaGroup:monitor-editor') && 'Editor' || contains(groups[*], 'ErynoaGroup:monitor-viewer') && 'Viewer' || ''
# Deny by default: no matching team claim -> no role -> login refused.
role_attribute_strict = true
allow_assign_grafana_admin = false
skip_org_role_sync = false
signout_redirect_url = $__env{RAGFIT_SOURCE_URL}/
